name: Publish npm packages
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish-0.1.1 to publish; otherwise run a dry-run'
        required: true
        default: dry-run
permissions:
  contents: read
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - name: Inspect package archives
        run: bash .github/scripts/verify-packages.sh
      - name: Publish schema, core, then CLI
        if: inputs.confirm == 'publish-0.1.1'
        run: |
          npm publish packages/schema/speckub-schema-0.1.1.tgz --access public
          npm publish packages/core/speckub-core-0.1.1.tgz --access public
          npm publish packages/cli/speckub-cli-0.1.1.tgz --access public
